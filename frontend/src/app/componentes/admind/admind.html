<router-outlet>
  <div class="min-h-screen w-full bg-slate-50 flex justify-center items-start p-4">
    <div class="w-full max-w-md bg-white rounded-2xl border border border-gray-50 shadow-sm p-6 md:p-2 mt-8">

    <h4>Hola, Administrador</h4>

      <div class="w-full max-w-md bg-white rounded-2xl border border-gray-300 p-6 md:p-6 shadow-sm mt-8">
        <h5>Gestionar Prestamos</h5>
        <!-- aqui debo listar todos los prestamos de diferentes usuarios-->
        <div class="flex flex-col">
         @for (item of listaMisPrestamos; track item) {
          <div class=" flex flex-row w-full  text-sm font-medium text-gray-700 mb-1 md:p8 ">
            <div class=" flex flex-row w-full  text-sm font-medium text-gray-700 mb-1 md:p8 ">
                <p class="text-sm font-medium text-gray-700  p-2"><strong>Usuario:</strong> {{ item.correo }}</p>
                <p class="text-sm font-medium text-gray-700  p-2"><strong>Monto:</strong> ${{ item.Monto }}</p>
                <p class="text-sm font-medium text-gray-700 p-2"><strong>Estado:</strong> <span >{{ item.status }}</span></p>
                <div class=" flex flex-row w-full  text-sm font-medium text-gray-700 mb-1 md:p8 ">
                <div w-full class="md:p-2 mt-1">
                    <button
                    class="w-full mt-2 py-2.5 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
                    (click)="goToAprove(item.id, item.correo )">Aprobar</button>
                </div>
                <div w-full class="md:p-2 mt-1">
                  <button
                    class="w-full mt-2 py-2.5 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
                    (click)="goToReject(item.id, item.correo)">Rechazar</button>
                </div>
                </div>
              </div>
            </div>
          } @empty {
            <p class="text-sm font-medium text-gray-700 mb-1">No tienes ningún préstamo registrado actualmente.</p>
          }
        </div>
      </div>
    </div>

  </div>

</router-outlet>
