<router-outlet>
  <div class="min-h-screen w-full bg-slate-50 flex justify-center items-start p-4">

    <div class="w-full max-w-md bg-white rounded-2xl border border-gray-300 p-6 md:p-8 shadow-sm mt-16">

      <h5 class="text-2xl font-bold text-gray-800 text-center mb-1">Iniciar Sesión</h5>
      <h2 class="text-sm font-normal text-gray-500 text-center mb-6">Ingrese sus credenciales</h2>

      <form class="space-y-4">

        <div class="flex flex-col">
          <label for="Email" class="text-sm font-medium text-gray-700 mb-1">Email:</label>
          <input type="email" id="Email" name="Email" required [(ngModel)]="correo"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
        </div>

        <div class="flex flex-col">
          <label for="password" class="text-sm font-medium text-gray-700 mb-1">Contraseña:</label>
          <input type="password" id="password" name="password"  required [(ngModel)]="password"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
        </div>

        <button type="button" (click)="goToLogin()"
                class="w-full mt-2 py-2.5 bg-gray-600 text-white font-semibold rounded-lg shadow-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200">
          Iniciar Sesión
        </button>

      </form>
    </div>

  </div>
</router-outlet>
